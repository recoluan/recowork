<!doctype html>
<html lang="{{html_lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{viewer_title}}</title>
    <link rel="stylesheet" href="/viewer.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand"><img class="brand-mark" src="/recowork-logo.svg" alt="" aria-hidden="true" /><span id="viewer-name">{{viewer_name}}</span></div>
        <label class="search"><span class="search-icon" aria-hidden="true">&#128269;</span><input id="search" type="search" placeholder="{{search_placeholder}}" /></label>
        <button id="archive-toggle" class="archive-toggle" type="button" aria-pressed="false">{{view_archive}}</button>
      </header>
      <aside class="sidebar"><div id="workspace-name" class="workspace-name"></div><nav id="navigation" aria-label="{{navigation_label}}"></nav></aside>
      <main id="main-content" class="main-content" tabindex="-1"></main>
    </div>
    <script src="/markdown-renderer.js"></script>
    <script src="/viewer.js"></script>
  </body>
</html>
